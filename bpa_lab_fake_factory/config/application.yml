spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:./db/FakeFactory}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
      time: HH:mm:ss

server:
  port: 9090

mqtt:
#  broker-url: ws://10.0.0.21:9001
  broker-url: ws://localhost:9001
  client-id: bpalab-fakefactory-kotlin-webapp
  default-topic: bpalab/fakefactory/messages
