<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{topicPayload.add.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="d-flex flex-wrap mb-4">
                <h1 class="flex-grow-1">[[#{topicPayload.add.headline}]]</h1>
                <div>
                    <a th:href="@{/topicPayloads}" class="btn btn-secondary">[[#{topicPayload.add.back}]]</a>
                </div>
            </div>
            <div th:replace="~{fragments/forms::globalErrors('topicPayload')}" />
            <form th:action="${requestUri}" method="post" novalidate="">
                <div th:replace="~{fragments/forms::inputRow(object='topicPayload', field='topic')}" />
                <div th:replace="~{fragments/forms::inputRow(object='topicPayload', field='payload')}" />
                <div th:replace="~{fragments/forms::inputRow(object='topicPayload', field='clock')}" />
                <input type="submit" th:value="#{topicPayload.add.headline}" class="btn btn-primary mt-4" />
            </form>
        </div>
    </body>
</html>
