services:
  mysql:
    image: mysql:9.2
    environment:
      - MYSQL_DATABASE=bpa_lab_demonstration_factory
      - MYSQL_ROOT_PASSWORD=P4ssword!
    ports:
      - 3070:3306
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -pP4ssword! -e 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./sql/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
    networks:
      - camunda

  # This is a lightweight configuration with Orchestration (Zeebe + Operate + Tasklist), Connectors, and Elasticsearch
  # See docker-compose-full.yaml for a configuration that also includes Optimize, Identity, Keycloak, Web Modeler, and Console.
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Consolidated Zeebe + Operate + Tasklist - https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#zeebe
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS="-XX:+PrintFlagsFinal"
    mem_limit: 1g
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./driver-lib:/driver-lib:ro
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  # Camunda Connectors - executes outbound and inbound connector logic
  # Docs: https://docs.camunda.io/docs/self-managed/connectors-deployment/connectors-configuration/
  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}
    container_name: connectors
    ports:
      - "8086:8080"
    environment:
      - management.endpoints.web.exposure.include=health,configprops
      - management.endpoint.health.probes.enabled=true
    env_file: connector-secrets.txt
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    configs:
      - source: connectors-config
        target: application.yaml
    networks:
      - camunda
    depends_on:
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy


  bpalabordermanagement:
    image: bpa_lab_demonstration_factory/ordermanagement
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql:3306/bpa_lab_demonstration_factory
      JAVA_TOOL_OPTIONS: -Dlogging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials=ERROR
      ZEEBE_REST_ADRESS: http://orchestration:8080
    build:
      dockerfile: bpa_lab_ordermanagement.dockerfile
      no_cache: true
    depends_on:
      mysql:
        condition: service_healthy
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy

    networks:
      - camunda

  bpalabproductioncontrol:
    image: bpa_lab_demonstration_factory/productioncontrol
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql:3306/bpa_lab_demonstration_factory
      JAVA_TOOL_OPTIONS: -Dlogging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials=ERROR
      ZEEBE_GRPC_ADRESS: http://orchestration:26500
      ZEEBE_REST_ADRESS: http://orchestration:8080
    build:
      dockerfile: bpa_lab_productioncontrol.dockerfile
      no_cache: true
    depends_on:
      mysql:
        condition: service_healthy
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy
    networks:
      - camunda

  bpalabmanufacturing:
    image: bpa_lab_demonstration_factory/manufacturing
    environment:
      JAVA_TOOL_OPTIONS: -Dlogging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials=ERROR
      ZEEBE_GRPC_ADRESS: http://orchestration:26500
      ZEEBE_REST_ADRESS: http://orchestration:8080
    #      MQTTBROKER_ADRESS: ws://host.docker.internal:9001
    build:
      dockerfile: bpa_lab_manufacturing.dockerfile
      no_cache: true
    depends_on:
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy
    networks:
      - camunda

  bpalabwarehouse:
    image: bpa_lab_demonstration_factory/warehouse
    environment:
      JAVA_TOOL_OPTIONS: -Dlogging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials=ERROR
      ZEEBE_GRPC_ADRESS: http://orchestration:26500
      ZEEBE_REST_ADRESS: http://orchestration:8080
    #      MQTTBROKER_ADRESS: ws://host.docker.internal:9001
    build:
      dockerfile: bpa_lab_warehouse.dockerfile
      no_cache: true
    depends_on:
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy
    networks:
      - camunda

  bpalabpurchasing:
    image: bpa_lab_demonstration_factory/purchasing
    environment:
      ZEEBE_ADDRESS: orchestration:26500
      CAMUNDA_AUTH_STRATEGY: NONE
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    build:
      dockerfile: bpa_lab_purchasing.dockerfile
      no_cache: true
    depends_on:
      mysql:
        condition: service_healthy
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy
    networks:
      - camunda

  bpalabshipment:
    image: bpa_lab_demonstration_factory/shipment
    environment:
      ZEEBE_ADDRESS: orchestration:26500
      CAMUNDA_AUTH_STRATEGY: NONE
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    build:
      dockerfile: bpa_lab_shipment.dockerfile
      no_cache: true
    depends_on:
      mysql:
        condition: service_healthy
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy
    networks:
      - camunda

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8086:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=P4ssword!
    depends_on:
      - mysql
    networks:
      - camunda

volumes:
  camunda:
  camunda-data:
  grafana_data:
  mysql_data:

networks:
  camunda:
    name: camunda

configs:
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080

  orchestration-config:
    file: ./configuration/${ORCHESTRATION_CONFIG_FILE:-application-h2.yaml}
