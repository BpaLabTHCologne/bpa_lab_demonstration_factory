  bpalabpurchasing:
    image: bpa_lab_demonstration_factory/purchasing
    environment:
      ZEEBE_ADDRESS: orchestration:26500
      CAMUNDA_AUTH_STRATEGY: NONE
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
