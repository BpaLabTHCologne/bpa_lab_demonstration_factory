plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'de.thkoeln.inf.bpalab.demofactory'

java.sourceCompatibility = '21'

bootRun {
    environment SPRING_PROFILES_ACTIVE: environment.SPRING_PROFILES_ACTIVE ?: 'local'
    environment JAVA_TOOL_OPTIONS: '-Dlogging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials=ERROR'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir '../bpa_lab_process_common/src/main/java'
        }
    }
    test {
        java {
            srcDir '../bpa_lab_process_common/src/main/java'
        }
    }
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-data-jpa:latest.release')
    runtimeOnly('com.mysql:mysql-connector-j')
    implementation('ch.qos.logback:logback-classic')
//    implementation("io.camunda:spring-boot-starter-camunda-sdk:8.7.5")
    // Source: https://mvnrepository.com/artifact/io.camunda/camunda-spring-boot-starter
    implementation("io.camunda:camunda-spring-boot-starter:8.9.12")
    testImplementation('org.springframework.boot:spring-boot-starter-test')
}

tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs = ["-parameters"]
}
